services:
  - type: web
    name: khaled-tec-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: RESEND_API_KEY
        sync: false   # set in Render dashboard (from resend.com)
      - key: MAIL_TO
        sync: false   # your inbox, e.g. khaledalqedra4@gmail.com
