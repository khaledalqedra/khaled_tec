services:
  - type: web
    name: khaled-tec-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MAIL_USER
        sync: false   # set in Render dashboard
      - key: MAIL_PASS
        sync: false   # set in Render dashboard (Gmail App Password)
